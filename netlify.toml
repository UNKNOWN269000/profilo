# ============================================
# Netlify hosting configuration
# Jaseem Nizardeen — 3D Profile Website
# ============================================

[build]
  # Pure static site — no build step needed
  publish = "."
  command = ""

# ---------- Security & caching headers ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Source filenames are intentionally stable, so revalidate them on each visit.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML should always revalidate so visitors get the newest deploy
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------- SPA-style fallback ----------
# Any unknown path serves the profile page
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
